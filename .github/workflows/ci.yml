name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-verification:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test_db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-secret-jwt-key-min-32-characters-long"
          ADMIN_API_KEY: "ci-admin-test-key"
          EMBEDDING_PROVIDER: "deterministic"
          ENVIRONMENT: "test"
        run: |
          pytest backend/tests -v

  frontend-verification:
    name: Frontend Test & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        run: npm test

      - name: Build Frontend Application (TypeScript + Vite)
        run: npm run build
